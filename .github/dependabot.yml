# Update pull requests for the pinned workflow actions and the npm tree. They
# target main, like every other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # The MCP SDK is pinned exactly on purpose; its upgrades are deliberate.
    ignore:
      - dependency-name: '@modelcontextprotocol/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
