name: bun-binary-smoke

# Standalone smoke test for the Bun-compiled binary path. Kept separate from
# ci.yml and release.yml rather than folded into either: it is not required
# for merges (Bun compatibility for this CLI is still being verified — see
# scripts/build-binary.mjs's file header for the known ROOT_DIR/asset-embedding
# gap found during that verification), and it must never gate the existing
# Node-SEA release pipeline in release.yml. Runs on demand or when the Bun
# build scripts themselves change, so a regression in the build step is caught
# without adding latency or a new required check to every PR.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-binary.mjs'
      - 'scripts/build-sea.mjs'
      - '.github/workflows/bun-binary-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: build + doctor smoke (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-latest
          - os: darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - name: Build one target with Bun
        run: node scripts/build-binary.mjs ${{ matrix.os }}

      - name: Smoke test — construct doctor against the compiled binary
        # Expected to fail until the ROOT_DIR/asset-embedding gap is fixed
        # (see scripts/build-binary.mjs). continue-on-error at the job level
        # keeps this red without blocking anything; the point of this job is
        # to surface the failure with a real error, not to hide it.
        run: ./dist/construct-${{ matrix.os }} doctor
