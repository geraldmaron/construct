name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # Compute per-target outputs so each downstream job only runs when files
  # in its scope changed. Saves CI minutes for doc-only PRs and avoids
  # retrieval evals running on persona/*.md edits.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      retrieval: ${{ steps.filter.outputs.retrieval }}
      deps: ${{ steps.filter.outputs.deps }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      templates: ${{ steps.filter.outputs.templates }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` is the widest filter — any change to source / tests /
          # bin / package.json triggers the full unit-test matrix. The
          # narrower filters (retrieval, …) trigger jobs that
          # don't need to run when the change is scoped elsewhere.
          filters: |
            code:
              - 'bin/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'agents/**'
              - 'package.json'
              - 'package-lock.json'
              - 'db/schema/**'
            retrieval:
              - 'lib/storage/**'
              - 'lib/evals/**'
              - 'lib/agent-contracts.mjs'
              - 'lib/agent-contracts-enforce.mjs'
              - 'agents/contracts.json'
              - 'db/schema/**'
              - 'tests/retrieval*.test.mjs'
              - 'package.json'

            deps:
              - 'package.json'
              - 'package-lock.json'
            agents:
              - 'agents/**'
              - 'lib/agents/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'CHANGELOG.md'
              - 'templates/docs/**'
            templates:
              - '.gitmessage'
              - '.github/pull_request_template.md'
              - 'scripts/lint-commits-pr.mjs'
            workflow:
              - '.github/workflows/**'

  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Windows is excluded from the unit-test matrix: a portion of the test
        # suite uses Unix-style paths, executable bits, and shell assumptions
        # that don't translate cleanly. Windows correctness is validated at
        # release time via the SEA binary build in release.yml. Cross-platform
        # support for the test fixtures is tracked as future work.
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node bin/construct doctor
      - run: node bin/construct docs:verify

  evals:
    name: retrieval evals
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.retrieval == 'true' || needs.changes.outputs.workflow == 'true'
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Retrieval-quality regression
        run: node bin/construct evals retrieval

  audit:
    name: dependency CVE audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (high+ only)
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: docs drift check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check managed doc regions are up to date
        run: node ./bin/construct docs:update --check
      - name: Check dashboard static bundle is up to date
        run: node ./bin/construct dashboard:sync --check

  lint-comments:
    name: comment policy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Enforce comment policy
        run: node ./bin/construct lint:comments

  lint-agents:
    name: agents registry schema
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Validate agents/registry.json against schema
        run: node ./bin/construct lint:agents

  lint-templates:
    name: template policy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Advisory gate: PR-body shape has no local-pre-flight equivalent (the
      # body doesn't exist until `gh pr create` runs), so a hard failure forces
      # a close+reopen to retrigger CI after a body fix. Step `continue-on-error`
      # surfaces violations in the logs without failing the job; a follow-up
      # adds a local `construct lint:pr` pre-flight so devs catch this pre-push.
      - name: Enforce commit + PR templates
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/lint-commits-pr.mjs

  gates-audit:
    name: gates audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflow == 'true' || needs.changes.outputs.code == 'true'
    # Default GITHUB_TOKEN cannot read branch protection (requires admin
    # scope). The audit gracefully treats it as `unfetchable` in CI and
    # skips protection-dependent gap detection; local runs by the repo
    # owner still validate branch protection.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audit cross-surface enforcement (CI / pre-push / pre-commit / branch protection)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./bin/construct gates:audit
