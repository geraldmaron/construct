name: ci

# Trigger model:
#   - PR opened/updated: single-runner test + consolidated lint suite.
#   - Push to main:      full OS x Node matrix + same lint suite.
#   - Weekly schedule:   secret rescan.
# Push to feature branches does NOT fire CI; the PR event covers them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    # Weekly secret scan on Monday 08:00 UTC — catches regressions in merged code
    - cron: '0 8 * * 1'

jobs:
  # Compute per-target outputs so each downstream job only runs when files
  # in its scope changed. Saves CI minutes for doc-only PRs and avoids
  # retrieval evals running on persona/*.md edits.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      retrieval: ${{ steps.filter.outputs.retrieval }}
      deps: ${{ steps.filter.outputs.deps }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      templates: ${{ steps.filter.outputs.templates }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` is the widest filter — any change to source / tests /
          # bin / package.json triggers the full unit-test matrix. The
          # narrower filters (retrieval, …) trigger jobs that
          # don't need to run when the change is scoped elsewhere.
          filters: |
            code:
              - 'bin/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'specialists/**'
              - 'profiles/**'
              - 'schemas/**'
              - 'package.json'
              - 'package-lock.json'
              - 'db/schema/**'
            retrieval:
              - 'lib/storage/**'
              - 'lib/specialist-contracts.mjs'
              - 'lib/specialist-contracts-enforce.mjs'
              - 'specialists/contracts.json'
              - 'db/schema/**'
              - 'tests/retrieval*.test.mjs'
              - 'tests/engine-eval-retrieval.test.mjs'
              - 'package.json'

            deps:
              - 'package.json'
              - 'package-lock.json'
            agents:
              - 'specialists/**'
              - 'lib/specialists/**'
              - 'skills/**'
              - 'rules/**'
              - 'templates/**'
              - 'profiles/**'
              - 'schemas/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'CHANGELOG.md'
              - 'templates/docs/**'
            templates:
              - '.gitmessage'
              - '.github/pull_request_template.md'
              - 'scripts/lint-commits-pr.mjs'
            workflow:
              - '.github/workflows/**'

  # Single-runner on PR, full matrix on main push. macOS + Node 20 only run
  # when merging to main; Windows correctness is covered by the SEA binary
  # build in release.yml. Cuts ~75% of test-runner minutes from PR runs.
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["20","22"]') }}
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node bin/construct doctor
      - run: node bin/construct docs:verify

  # One job that runs every quick lint/check under a single npm ci. Replaces
  # the prior nine independent jobs (lint-comments, lint-prose, lint-profiles,
  # lint-agents, lint-contracts, lint-templates, docs drift, gates-audit) each
  # of which paid the ~45s npm-ci tax. Each step still appears in the GitHub
  # UI so failure surface stays granular; only the runner setup is shared.
  lint:
    name: lint suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: comment policy
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: node ./bin/construct lint:comments
      - name: prose policy
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:prose
      - name: profile + flavor schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:profiles -- --quiet
      - name: agents registry schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: node ./bin/construct lint:agents
      - name: agent contracts schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: node ./bin/construct lint:contracts
      - name: docs drift check
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: node ./bin/construct docs:update --check
      - name: dashboard bundle drift
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        # Build + copy + parity check in one shot via the construct CLI.
        # Same command runs in .beads/hooks/pre-push and the Claude Code
        # pre-push-gate.mjs hook locally — tests/ci-parity.test.mjs asserts
        # the three invocations stay identical. Earlier the step ran
        # `build:next` (next build only, no copy to lib/server/static/)
        # which always tripped --check on fresh CI checkouts.
        run: node ./bin/construct dashboard:sync --build
      - name: gates audit
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./bin/construct gates:audit
      # Advisory gate: PR-body shape has no local-pre-flight equivalent (the
      # body doesn't exist until `gh pr create` runs), so a hard failure forces
      # a close+reopen to retrigger CI after a body fix. Step `continue-on-error`
      # surfaces violations in the logs without failing the job; a follow-up
      # adds a local `construct lint:pr` pre-flight so devs catch this pre-push.
      - name: template policy
        if: needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/lint-commits-pr.mjs

  evals:
    name: retrieval evals
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.retrieval == 'true' || needs.changes.outputs.workflow == 'true'
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Retrieval-quality regression
        run: node bin/construct evals retrieval

  audit:
    name: dependency CVE audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: npm audit (high+ only)
        # Scope to root deps only. Workspace packages (apps/docs, apps/dashboard,
        # packages/cx-ui) are build-time tooling for the docs site and dashboard,
        # not runtime deps of the published @geraldmaron/construct CLI. Their
        # advisories are tracked separately; this gate guards the npm-published
        # surface. Mirrors the pre-push gate in lib/hooks/pre-push-gate.mjs.
        run: npm audit --omit=dev --audit-level=high --workspaces=false

  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  postgres-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    name: postgres + pgvector integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: construct
          POSTGRES_USER: construct
          POSTGRES_DB: construct
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run migrations runner end-to-end
        env:
          DATABASE_URL: postgres://construct:construct@127.0.0.1:5432/construct
          CONSTRUCT_EMBEDDING_MODEL: hashing
        run: |
          node -e "
          const { runMigrations } = await import('./lib/storage/migrations.mjs');
          const postgres = (await import('postgres')).default;
          const sql = postgres(process.env.DATABASE_URL);
          try {
            const result = await runMigrations(sql);
            console.log('migrations applied:', result.applied);
            console.log('migrations skipped:', result.skipped);
          } finally { await sql.end(); }
          "
      - name: Postgres + vector roundtrip tests
        run: node --test --test-timeout=120000 tests/functional/postgres-roundtrip.functional.test.mjs tests/functional/vector-roundtrip.functional.test.mjs

  dashboard-integration:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    name: dashboard server + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dashboard build
        run: node --test --test-timeout=180000 tests/functional/dashboard-build.functional.test.mjs
      - name: Dashboard server endpoint + auth + SSE tests
        run: node --test --test-timeout=60000 tests/functional/dashboard/*.functional.test.mjs

  live-llm-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: live LLM via OpenRouter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Specialist + tier tests against OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY not set; skipping live-LLM job"
            exit 0
          fi
          node --test --test-timeout=180000 tests/functional/llm/*.functional.test.mjs

  # Aggregator job. Branch protection requires `ci-required` instead of the
  # individual conditional jobs above. This always runs, sees the result of
  # every needed job (success / skipped / failure / cancelled), and fails only
  # when any need actually failed or was cancelled. Skipped is treated as a
  # pass because path filters intentionally skip work that isn't relevant
  # (e.g. test job skips on doc-only PRs).
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test, lint, evals, audit, secret-scan, postgres-integration, dashboard-integration]
    steps:
      - name: Verify required jobs passed or skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key)
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled required jobs: $failed"
            exit 1
          fi
          echo "All required jobs passed or skipped cleanly."
