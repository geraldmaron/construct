name: ci

# Trigger model:
#   - PR opened/updated:    single-runner test + consolidated lint suite.
#   - Push to main:         full OS x Node matrix + same lint suite.
#   - Weekly schedule:      secret rescan.
#   - workflow_dispatch:    on-demand full CI run.
# Push to feature branches does NOT fire CI; the PR event covers them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    # Weekly secret scan on Monday 08:00 UTC — catches regressions in merged code
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel superseded runs on PR pushes (saves runner minutes when a contributor
# force-pushes several times in a minute). Pushes to main are never cancelled —
# every merged commit gets its own complete run for audit + release purposes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Heavy jobs (test matrix, evals, audit) only run when code or
# workflow files change. Doc-only PRs skip them and still get the cheap policy checks
# (lint-comments, lint-templates, docs drift, gates audit, secret scan).

jobs:
  # Compute per-target outputs so each downstream job only runs when files
  # in its scope changed. Saves CI minutes for doc-only PRs and avoids
  # retrieval evals running on persona/*.md edits.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      retrieval: ${{ steps.filter.outputs.retrieval }}
      deps: ${{ steps.filter.outputs.deps }}
      docssite: ${{ steps.filter.outputs.docssite }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      templates: ${{ steps.filter.outputs.templates }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `code` is the widest filter — any change to source / tests /
          # bin / package.json triggers the full unit-test matrix. The
          # narrower filters (retrieval, …) trigger jobs that
          # don't need to run when the change is scoped elsewhere.
          filters: |
            code:
              - 'bin/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'specialists/**'
              - 'profiles/**'
              - 'schemas/**'
              - 'package.json'
              - 'package-lock.json'
              - 'db/schema/**'
            retrieval:
              - 'lib/storage/**'
              - 'lib/specialist-contracts.mjs'
              - 'lib/contracts/violation-log.mjs'
              - 'specialists/contracts.json'
              - 'db/schema/**'
              - 'tests/retrieval*.test.mjs'
              - 'tests/engine-eval-retrieval.test.mjs'
              - 'package.json'

            deps:
              - 'package.json'
              - 'package-lock.json'
            agents:
              - 'specialists/**'
              - 'lib/specialists/**'
              - 'skills/**'
              - 'rules/**'
              - 'templates/**'
              - 'profiles/**'
              - 'schemas/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'CHANGELOG.md'
              - 'templates/docs/**'
            templates:
              - '.gitmessage'
              - '.github/pull_request_template.md'
              - 'scripts/lint-commits-pr.mjs'
            docssite:
              - 'apps/docs/**'
              - 'packages/cx-ui/**'
              - 'docs/**'
              - '.github/workflows/pages.yml'
            workflow:
              - '.github/workflows/**'

  # Single-runner on PR, full matrix on main push. macOS + Node 20 only run
  # when merging to main; Windows correctness is covered by the SEA binary
  # build in release.yml. Cuts ~75% of test-runner minutes from PR runs.
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22"]') || fromJSON('["20","22"]') }}
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save ink react
      - run: npm test
      - run: npm run doctor
      - run: npm run docs:verify
      - name: coverage (report-only, main pushes)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run coverage

  # One job that runs every quick lint/check under a single npm ci. Replaces
  # the prior nine independent jobs (lint-comments, lint-prose, lint-profiles,
  # lint-agents, lint-contracts, lint-templates, docs drift, gates-audit) each
  # of which paid the ~45s npm-ci tax. Each step still appears in the GitHub
  # UI so failure surface stays granular; only the runner setup is shared.
  lint:
    name: lint suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: comment policy
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:comments
      - name: eslint (real-bug rules)
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:js
      - name: profile + flavor schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:profiles -- --quiet
      - name: agents registry schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:agents
      - name: agent contracts schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:contracts
      - name: docs drift check
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run docs:update -- --check
      - name: docs site build
        if: needs.changes.outputs.docssite == 'true' || needs.changes.outputs.workflow == 'true'
        # PR-time guard for the Pages deploy. apps/docs depends on the
        # workspace package @cx/ui (packages/cx-ui); root `npm ci` resolves
        # it via the workspaces config. Building from root here matches
        # what pages.yml does on main — catches workspace-resolution drift
        # before the Pages deploy fails post-merge with a 404 from the
        # public npm registry.
        env:
          DOCS_BASE_PATH: /construct
        run: |
          npm run docs:site
          npm --prefix apps/docs run build
      - name: gates audit
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gates:audit
      # Advisory gate: PR-body shape has no local-pre-flight equivalent (the
      # body doesn't exist until `gh pr create` runs), so a hard failure forces
      # a close+reopen to retrigger CI after a body fix. Step `continue-on-error`
      # surfaces violations in the logs without failing the job; a follow-up
      # adds a local `construct lint:pr` pre-flight so devs catch this pre-push.
      - name: template policy
        if: needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run lint:templates

  evals:
    name: retrieval evals
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.retrieval == 'true' || needs.changes.outputs.workflow == 'true'
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Retrieval-quality regression
        run: npm run evals -- retrieval

  audit:
    name: dependency CVE audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - run: npm ci --ignore-scripts
      - name: npm audit (high+ only)
        # Scope to root deps only. Workspace packages (apps/docs, packages/cx-ui)
        # are build-time tooling for the docs site, not runtime deps of the
        # published @geraldmaron/construct CLI. Their
        # advisories are tracked separately; this gate guards the npm-published
        # surface. Mirrors the pre-push gate in lib/hooks/pre-push-gate.mjs.
        run: npm audit --omit=dev --audit-level=high --workspaces=false

      - name: consumer-perspective audit (packed artifact, no overrides)
        # The repo audit above applies this package.json's `overrides`, which a
        # consumer never receives. This step packs the artifact and audits the
        # tree a downstream `npm install` actually resolves — the only check that
        # catches transitive CVEs a repo-local override would otherwise mask.
        run: npm run audit:published

  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregator job. Branch protection requires `ci-required` instead of the
  # individual conditional jobs above. This always runs, sees the result of
  # every needed job (success / skipped / failure / cancelled), and fails only
  # when any need actually failed or was cancelled. Skipped is treated as a
  # pass because path filters intentionally skip work that isn't relevant
  # (e.g. test job skips on doc-only PRs).
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test, lint, evals, audit, secret-scan]
    steps:
      - name: Verify required jobs passed or skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key)
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled required jobs: $failed"
            exit 1
          fi
          echo "All required jobs passed or skipped cleanly."
