name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  sterile-readonly-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci
      - name: run suite with HOME pointed at a read-only directory
        run: |
          mkdir -p /tmp/readonly-home
          chmod 555 /tmp/readonly-home
          HOME=/tmp/readonly-home npm test

  packaged-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm run smoke
