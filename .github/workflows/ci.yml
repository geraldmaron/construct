name: ci

# Trigger model:
#   - PR opened/updated:    single-runner test + consolidated lint suite.
#   - Push to main:         full OS x Node matrix + same lint suite.
#   - Weekly schedule:      secret rescan.
#   - workflow_dispatch:    on-demand full CI run.
# Push to feature branches does NOT fire CI; the PR event covers them.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    # Weekly secret scan on Monday 08:00 UTC — catches regressions in merged code
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Cancel superseded runs on PR pushes (saves runner minutes when a contributor
# force-pushes several times in a minute). Pushes to main are never cancelled —
# every merged commit gets its own complete run for audit + release purposes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Heavy jobs (test matrix, evals, audit) only run when code or
# workflow files change. Doc-only PRs skip them and still get the cheap policy checks
# (lint-comments, lint-templates, docs drift, gates audit, secret scan).

jobs:
  # Compute per-target outputs so each downstream job only runs when files
  # in its scope changed. Saves CI minutes for doc-only PRs and avoids
  # retrieval evals running on persona/*.md edits.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      retrieval: ${{ steps.filter.outputs.retrieval }}
      deps: ${{ steps.filter.outputs.deps }}
      docssite: ${{ steps.filter.outputs.docssite }}
      agents: ${{ steps.filter.outputs.agents }}
      docs: ${{ steps.filter.outputs.docs }}
      templates: ${{ steps.filter.outputs.templates }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Full history so paths-filter can diff via git when the GitHub
          # Files Changed API is unreliable (large staging→main promote PRs).
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        with:
          # Empty token forces git-based change detection instead of the
          # GitHub REST Files Changed API. Promote PRs (staging→main) can
          # exceed ~2k–3k files; API fetches then fail with connection
          # resets ("other side closed") or truncate at 3000 files.
          token: ''
          # `code` is the widest filter — any change to source / tests /
          # bin / package.json triggers the full unit-test matrix. The
          # narrower filters (retrieval, …) trigger jobs that
          # don't need to run when the change is scoped elsewhere.
          filters: |
            code:
              - 'bin/**'
              - 'lib/**'
              - 'tests/**'
              - 'scripts/**'
              - 'registry/**'
              - 'profiles/**'
              - 'schemas/**'
              - 'package.json'
              - 'package-lock.json'
              - 'db/schema/**'
            retrieval:
              - 'lib/storage/**'
              - 'lib/specialist-contracts.mjs'
              - 'lib/contracts/violation-log.mjs'
              - 'registry/capabilities.json'
              - 'db/schema/**'
              - 'tests/retrieval*.test.mjs'
              - 'tests/engine-eval-retrieval.test.mjs'
              - 'package.json'

            deps:
              - 'package.json'
              - 'package-lock.json'
            agents:
              - 'registry/**'
              - 'lib/worker-profiles/**'
              - 'skills/**'
              - 'rules/**'
              - 'templates/**'
              - 'profiles/**'
              - 'schemas/**'
            docs:
              - 'docs/**'
              - 'README.md'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'CHANGELOG.md'
              - 'templates/docs/**'
            templates:
              - '.gitmessage'
              - '.github/pull_request_template.md'
              - 'scripts/lint-commits-pr.mjs'
            docssite:
              - 'apps/docs/**'
              - 'packages/construct-ui/**'
              - 'docs/**'
              - '.github/workflows/pages.yml'
            workflow:
              - '.github/workflows/**'

  # PR gate: ubuntu × Node 20/22 (min + max supported). The macOS legs run on
  # main push / schedule / dispatch only — macOS runners are an order of
  # magnitude more expensive, slower to schedule, and the per-PR macOS signal
  # is largely redundant with bun-binary-smoke's darwin-arm64 build+doctor+demo
  # job, which does run on every PR. A macOS-only regression still gates the
  # release path (main push runs the full matrix; release.yml builds darwin
  # SEA binaries). Windows correctness is covered by the SEA binary build in
  # release.yml.
  # The ubuntu suite runs as 3 stripe shards (scripts/run-tests.mjs --shard) so
  # wall-clock time is bounded by the slowest third. macOS stays single-shard
  # (shard 1 of 1, shards 2/3 excluded) — its runners are scarce and the leg
  # only exists as a darwin canary. doctor / docs:verify / coverage are
  # whole-checkout checks, not per-shard ones, so only shard 1 runs them.
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }} / shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Bound wall-clock so a stuck apt mirror / download cannot burn a runner for
    # an hour (observed: LibreOffice apt crawl of azure.archive.ubuntu.com).
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        node: ["20", "22"]
        shard: [1, 2, 3]
        exclude:
          - os: macos-latest
            shard: 2
          - os: macos-latest
            shard: 3
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Tool installs live in scripts/ci/setup-toolchain.sh — the single source
      # of truth shared with the local Docker replica (scripts/ci-repro/). It
      # pins typst + bd + d2 as sha256-verified release binaries, so the setup-go
      # step the old inline bd-install needed is gone (the go-install fallback
      # is documented in the script). The pinned binaries land in ~/.local/bin,
      # which is cached; apt/brew packages are cheap enough to install per run.
      # mermaid-cli needs npm, so setup-mermaid-cli.sh runs after npm ci (the
      # Docker replica installs Node after baking setup-toolchain.sh).
      - name: cache pinned tool binaries (typst, bd, d2, mermaid+chrome)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/bin
            ~/.local/mermaid-cli
          key: toolbin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/setup-toolchain.sh', 'scripts/ci/setup-mermaid-cli.sh') }}
      - name: install test toolchain (typst, bd, d2, pandoc, poppler, libreoffice)
        timeout-minutes: 12
        run: bash scripts/ci/setup-toolchain.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install mermaid-cli (mmdc) + Chrome for figures:true exports
        run: bash scripts/ci/setup-mermaid-cli.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build derived test fixtures (living graph + seeded vector index)
        run: bash scripts/ci/build-test-fixtures.sh
      - run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && '1' || '3' }}
      - run: npm run doctor
        if: matrix.shard == 1
      - run: npm run docs:verify
        if: matrix.shard == 1
      - name: restore shadow history cache
        if: github.event_name == 'pull_request' && matrix.shard == 1 && matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .construct/shadow-history
          key: shadow-history-store-v1
      - name: shadow-mode test-impact analysis (non-blocking)
        if: github.event_name == 'pull_request' && matrix.shard == 1 && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/graph-impact-shadow.mjs
      - name: archive shadow artifact to history
        if: github.event_name == 'pull_request' && matrix.shard == 1 && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p .construct/shadow-history
          cp .construct/shadow-impact.json ".construct/shadow-history/${{ github.run_id }}.json"
      - name: upload shadow-impact artifact
        if: github.event_name == 'pull_request' && matrix.shard == 1 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: shadow-impact-${{ github.run_id }}
          path: .construct/shadow-impact.json
          retention-days: 90
      - name: coverage (report-only, main pushes)
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run coverage

  # LMCP-L8: optional, non-blocking (not in ci-required's `needs`, and
  # continue-on-error besides) — a real Chromium install + render check for the
  # `construct publish --format html` artifact template. tests/browser/*.test.mjs
  # already self-skips when no browser is installed, so this job only adds
  # signal on top of that; its absence or failure never gates a merge.
  browser-render:
    name: browser render check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: node --test tests/browser/*.test.mjs

  # LMCP-L6: team-mode acceptance leg against a real Postgres service container —
  # not the mocked `sql` clients tests/pg-queue-reliability.test.mjs and
  # tests/worker-runtime.test.mjs use for their unit-level checks. Optional,
  # non-blocking (continue-on-error, not in ci-required's `needs`) until this
  # config has proven green across a few real runs; the solo-mode leg
  # (tests/acceptance/modes/solo.acceptance.test.mjs) requires no service and
  # already runs inside the main `test` job via the default npm-test sweep.
  team-mode-acceptance:
    name: team mode acceptance (postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construct_team_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/construct_team_harness
      CONSTRUCT_DEPLOYMENT_MODE: team
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node ./bin/construct db migrate
      - run: node --test tests/acceptance/modes/team.acceptance.test.mjs

  # LMCP-L6: enterprise-mode acceptance leg. Most of this suite (H1 fail-closed
  # tenant resolution, H5 fail-closed mandatory-audit gate, H6 status/doctor
  # capability-truth honesty) needs no database and also runs in the main `test`
  # job's default npm-test sweep. Only the tenant-scoped worker-heartbeat capability
  # check needs a real Postgres, so this job exists solely to exercise that leg
  # instead of letting it self-skip; same optional/non-blocking posture as
  # team-mode-acceptance above until proven green across a few real runs.
  enterprise-mode-acceptance:
    name: enterprise mode acceptance (postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: construct_enterprise_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/construct_enterprise_harness
      CONSTRUCT_DEPLOYMENT_MODE: enterprise
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node ./bin/construct db migrate
      - run: node --test tests/acceptance/modes/enterprise.acceptance.test.mjs

  # One job that runs every quick lint/check under a single npm ci. Replaces
  # the prior nine independent jobs (lint-comments, lint-prose, lint-profiles,
  # lint-agents, lint-contracts, lint-templates, docs drift, gates-audit) each
  # of which paid the ~45s npm-ci tax. Each step still appears in the GitHub
  # UI so failure surface stays granular; only the runner setup is shared.
  lint:
    name: lint suite
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: comment policy
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:comments
      - name: eslint (real-bug rules)
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:js
      - name: dependency intent
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run deps:check
      - name: profile + flavor schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:scopes -- --quiet
      - name: agents registry schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:agents
      - name: agent contracts schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:contracts
      - name: Workspace Preset schema
        if: needs.changes.outputs.agents == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run lint:workspace-presets
      - name: docs drift check
        if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: npm run docs:update -- --check
      - name: docs site build
        if: needs.changes.outputs.docssite == 'true' || needs.changes.outputs.workflow == 'true'
        # PR-time guard for the Pages deploy. apps/docs depends on the
        # workspace package @construct/ui (packages/construct-ui); root `npm ci` resolves
        # it via the workspaces config. Building from root here matches
        # what pages.yml does on main — catches workspace-resolution drift
        # before the Pages deploy fails post-merge with a 404 from the
        # public npm registry.
        env:
          DOCS_BASE_PATH: /construct
        run: |
          npm run docs:site
          npm --prefix apps/docs run build
      - name: gates audit
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gates:audit
      - name: static analysis (warn-first)
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
        run: |
          npm run static:knip || true
          npm run static:cruise || true
      - name: certification gate
        if: needs.changes.outputs.code == 'true' || needs.changes.outputs.agents == 'true' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
        run: node ./bin/construct certify gate
      # Living-graph drift gate (LMCP-C8). Runs UNCONDITIONALLY whenever the
      # lint job runs — no change-filter guard — because every graph input
      # (lib, tests, specialists, skills, docs) lives under a filter that
      # already triggers this job, and gate honesty (the bead's acceptance)
      # forbids a code path that could skip it. Rebuilds the graph and fails on
      # strict-mode validate errors or a stale source. CHANGED_FILES feeds the
      # C4 impact annotation; the base ref is present because checkout above
      # uses fetch-depth: 0.
      - name: graph drift gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$PR_BASE_SHA"...HEAD || true)"
            export CHANGED_FILES
          fi
          node scripts/run-graph-gate.mjs
      # Blocking gate on commit-subject convention and PR-body shape. Runs on
      # every pull_request event unconditionally (not gated by the templates/
      # workflow change-filter) — a staging-merge PR whose diff happens to
      # touch neither would otherwise skip commit-subject linting entirely,
      # the gap that let 26 non-conforming subjects accumulate silently across
      # staging merges until the next release-promotion PR's much wider commit
      # range caught them as a batch (construct-9tg43). PR-body-shape checking
      # has no local pre-flight (the body does not exist until `gh pr create`
      # runs), so a human fixes a violation by editing the body and
      # close+reopening to retrigger CI. Bot PRs (dependabot) are exempt
      # inside scripts/lint-commits-pr.mjs by author — a bot cannot fill the
      # human template — so the step stays hard-failing for humans. Still
      # conditioned on the workflow filter for push-to-main runs, where there
      # is no PR body/commit range to check.
      - name: template policy
        if: github.event_name == 'pull_request' || needs.changes.outputs.templates == 'true' || needs.changes.outputs.workflow == 'true'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: npm run lint:templates

  graph-verify:
    name: graph verify
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: build derived test fixtures (living graph)
        run: bash scripts/ci/build-test-fixtures.sh
      - name: graph verify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$PR_BASE_SHA"...HEAD || true)"
            export CHANGED_FILES
          fi
          node scripts/run-graph-verify.mjs

  graph-impact-gate:
    name: graph impact gate
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.workflow == 'true')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: build derived test fixtures (living graph)
        run: bash scripts/ci/build-test-fixtures.sh
      - name: restore shadow history cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .construct/shadow-history
          key: shadow-history-store-v1
      - name: download current shadow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.0.0
        continue-on-error: true
        with:
          name: shadow-impact-${{ github.run_id }}
          path: .construct
      - name: graph impact promotion report
        run: node scripts/graph-impact-promotion-report.mjs --json > .construct/promotion-report.json
      - name: graph impact gate
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/graph-impact-gate.mjs

  evals:
    name: retrieval evals
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.retrieval == 'true' || needs.changes.outputs.workflow == 'true'
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Retrieval-quality regression
        run: npm run evals -- retrieval

  audit:
    name: dependency CVE audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
      - run: npm ci --ignore-scripts
      - name: npm audit (high+ only)
        # Scope to root deps only. Workspace packages (apps/docs, packages/construct-ui)
        # are build-time tooling for the docs site, not runtime deps of the
        # published @geraldmaron/construct CLI. Their
        # advisories are tracked separately; this gate guards the npm-published
        # surface. Mirrors the pre-push gate in lib/hooks/pre-push-gate.mjs.
        run: npm audit --omit=dev --audit-level=high --workspaces=false

      - name: consumer-perspective audit (packed artifact, no overrides)
        # The repo audit above applies this package.json's `overrides`, which a
        # consumer never receives. This step packs the artifact and audits the
        # tree a downstream `npm install` actually resolves — the only check that
        # catches transitive CVEs a repo-local override would otherwise mask.
        run: npm run audit:published

      - name: supply-chain exception expiration
        run: node scripts/check-supply-chain-exceptions.mjs

  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregator job. Branch protection requires `ci-required` instead of the
  # individual conditional jobs above. This always runs, sees the result of
  # every needed job (success / skipped / failure / cancelled), and fails only
  # when any need actually failed or was cancelled. Skipped is treated as a
  # pass because path filters intentionally skip work that isn't relevant
  # (e.g. test job skips on doc-only PRs).
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test, lint, graph-verify, graph-impact-gate, evals, audit, secret-scan]
    steps:
      - name: Verify required jobs passed or skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key)
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled required jobs: $failed"
            exit 1
          fi
          echo "All required jobs passed or skipped cleanly."
