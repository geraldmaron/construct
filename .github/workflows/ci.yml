# Ordinary push and pull request run the real gate: lint, typecheck, full
# unit suite, sterile read-only HOME, and packaged-install smoke. Live host
# conformance stays out of PR (credentials); release.yml still records that
# evidence before publish. Tracker-only commits under .beads/ do not start a run.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
  pull_request:
    paths-ignore:
      - '.beads/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm test

  sterile-readonly-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
      - run: npm ci
      - name: run suite with HOME pointed at a read-only directory
        run: |
          mkdir -p /tmp/readonly-home
          chmod 555 /tmp/readonly-home
          HOME=/tmp/readonly-home npm test

  packaged-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
      - run: npm ci
      - run: npm run smoke
