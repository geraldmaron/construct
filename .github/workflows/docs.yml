name: docs auto-update

on:
  push:
    branches: [main]
    paths:
      - 'lib/cli-commands.mjs'
      - 'lib/hooks/**'
      - 'registry/**'
      - 'README.md'
      - 'docs/**'

permissions: {}

jobs:
  update-docs:
    name: regenerate managed regions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Regenerate AUTO regions
        run: npm run docs:update
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/guides/concepts/architecture.mdx
          if git diff --cached --quiet; then
            echo "No managed regions changed — nothing to commit"
            exit 0
          fi
          git commit -m "docs: regenerate managed regions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
