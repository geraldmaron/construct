name: docs auto-update

on:
  push:
    branches: [main]
    paths:
      - 'lib/cli-commands.mjs'
      - 'lib/hooks/**'
      - 'specialists/registry.json'
      - 'README.md'
      - 'docs/**'

permissions: {}

jobs:
  update-docs:
    name: regenerate managed regions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
      - run: npm ci
      - name: Regenerate AUTO regions
        run: npm run docs:update
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/guides/concepts/architecture.mdx
          if git diff --cached --quiet; then
            echo "No managed regions changed — nothing to commit"
            exit 0
          fi
          git commit -m "docs: regenerate managed regions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
