name: docs auto-update

on:
  push:
    branches: [main]
    paths:
      - 'lib/cli-commands.mjs'
      - 'lib/hooks/**'
      - 'specialists/registry.json'
      - 'README.md'
      - 'docs/**'

jobs:
  update-docs:
    name: regenerate managed regions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Regenerate AUTO regions
        run: node ./bin/construct docs:update
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.md docs/concepts/architecture.mdx
          if git diff --cached --quiet; then
            echo "No managed regions changed — nothing to commit"
            exit 0
          fi
          git commit -m "docs: regenerate managed regions [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
