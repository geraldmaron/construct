name: hook performance budgets

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per hook (default 20)
        required: false
        default: '20'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONSTRUCT_BENCH_HOOKS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run hook budget gate
        run: |
          if [ -n "${{ inputs.runs }}" ]; then
            node scripts/bench-hooks.mjs --runs=${{ inputs.runs }} --json > /tmp/bench-report.json
          else
            node scripts/bench-hooks.mjs --json > /tmp/bench-report.json
          fi
          node --test tests/perf/hook-budgets.test.mjs
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hook-bench-report
          path: |
            /tmp/bench-report.json
            .cx/bench/
          if-no-files-found: ignore
          retention-days: 14
