name: pages-v2

on:
  push:
    branches:
      - main
      - feat/docs-fumadocs-phase1
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'lib/cli-commands.mjs'
      - 'lib/auto-docs.mjs'
      - 'lib/hooks/**'
      - 'agents/registry.json'
      - 'bin/construct'
      - '.github/workflows/pages-v2.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'lib/cli-commands.mjs'
      - 'lib/auto-docs.mjs'
      - 'lib/hooks/**'
      - 'agents/registry.json'
      - 'bin/construct'
      - '.github/workflows/pages-v2.yml'
  workflow_dispatch:

concurrency:
  group: pages-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build docs (Fumadocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate reference MDX from canonical sources
        run: node ./bin/construct docs:site
      - name: Install docs site deps
        run: npm --prefix apps/docs install
      - name: Build static site
        env:
          DOCS_BASE_PATH: /construct/v2
        run: npm --prefix apps/docs run build
      - name: Upload static export as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fumadocs-site
          path: apps/docs/out
          retention-days: 7
          if-no-files-found: error
