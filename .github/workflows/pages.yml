name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'apps/docs/**'
      - 'CONTRIBUTING.md'
      - 'specialists/registry.json'
      - 'lib/cli-commands.mjs'
      - 'lib/auto-docs.mjs'
      - 'lib/hooks/**'
      - 'bin/construct'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs (Next.js)
    runs-on: ubuntu-latest
    if: vars.PAGES_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: CVE audit on apps/docs dependencies
        # high/critical advisories gate the docs build; moderate findings
        # surface in the audit output but do not block. Catches a future
        # MDX or Next.js CVE before a Pages deploy carries it. Uses the
        # workspace selector — apps/docs has no local lockfile because
        # the repo root owns the hoisted shrinkwrap.
        run: npm audit --workspace=construct-docs --audit-level=high
      - name: Regenerate reference MDX from canonical sources
        run: node ./bin/construct docs:site
      - name: Build static site
        env:
          DOCS_BASE_PATH: /construct
        run: npm --prefix apps/docs run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
