name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'apps/docs/**'
      - 'CONTRIBUTING.md'
      - 'registry/**'
      - 'lib/cli-commands.mjs'
      - 'lib/auto-docs.mjs'
      - 'lib/hooks/**'
      - 'bin/construct'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs (Next.js)
    runs-on: ubuntu-latest
    if: vars.PAGES_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: CVE audit on apps/docs dependencies
        # high/critical advisories gate the docs build; moderate findings
        # surface in the audit output but do not block. Catches a future
        # MDX or Next.js CVE before a Pages deploy carries it. Uses the
        # workspace selector — apps/docs has no local lockfile because
        # the repo root owns the hoisted shrinkwrap.
        #
        # TEMPORARY: continue-on-error while construct-qdc9o is open. The
        # only findings as of 2026-07-25 are advisories bundled inside
        # next@16.2.11 itself (its internal postcss/sharp) — next is
        # already latest stable and npm overrides cannot reach into its
        # nested deps, so this has no fix reachable from this repo until
        # Next.js ships a patch release. Remove continue-on-error once
        # construct-qdc9o is resolved or the advisories clear.
        continue-on-error: true
        run: npm audit --workspace=construct-docs --audit-level=high
      - name: Regenerate reference MDX from canonical sources
        run: npm run docs:site
      - name: Build static site
        env:
          DOCS_BASE_PATH: /construct
        run: npm --prefix apps/docs run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
