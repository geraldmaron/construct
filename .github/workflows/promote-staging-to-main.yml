name: Promote staging → main

# Standard environment-promotion flow: feature → staging (integration / pre-prod) →
# main (production). Work merges into `staging`; a release is a promotion of `staging`
# to `main`, which triggers the production deploy (.github/workflows/deploy.yml).
#
# This workflow opens (or updates) the promotion PR from `staging` into `main` on demand.
# It never merges — a human reviews and merges the PR so production is always a deliberate,
# reviewed step. Prefer SYNC_PR_TOKEN (a repo-scoped PAT) so the PR gets CI; falls back to
# GITHUB_TOKEN otherwise (which, per GitHub's anti-loop guard, will not auto-trigger CI).

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Promotion PR title"
        required: false
        default: "release: promote staging → main"

permissions: {}

concurrency:
  group: promote-staging-to-main
  cancel-in-progress: false

  # construct-wrfcx gate: the daily staging full matrix must be green before we
  # open/refresh the promotion PR. Without this, staging could carry a red
  # matrix into production undetected. Fails the workflow (and notifies watchers)
  # if the most recent staging-full-matrix run did not conclude successfully.
  verify-staging-matrix:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Check latest staging full matrix run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow staging-full-matrix.yml --branch staging --limit 1 \
            --json conclusion --jq '.[0].conclusion // empty')
          echo "Latest staging-full-matrix conclusion: ${conclusion:-<none>}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to promote: staging full matrix is not green (latest=$conclusion). Fix staging and wait for a green scheduled run."
            exit 1
          fi

  open-promotion-pr:
    runs-on: ubuntu-latest
    needs: verify-staging-matrix
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Open or update staging → main PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -euo pipefail
          if git rev-list --left-right --count origin/main...origin/staging | awk '{exit ($2==0)}'; then
            echo "staging has no commits ahead of main — nothing to promote."
            exit 0
          fi
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')
          BODY="Production promotion of \`staging\` → \`main\`. Merging deploys to production (deploy.yml). Review the diff below; this is the gate before prod."
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$PR_TITLE" --body "$BODY"
            echo "Updated existing promotion PR #$EXISTING"
          else
            gh pr create --base main --head staging --title "$PR_TITLE" --body "$BODY"
          fi
