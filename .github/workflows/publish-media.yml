name: publish-media

on:
  push:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  pull_request:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 'stable'
      - name: Install VHS toolchain
        run: |
          go install github.com/charmbracelet/vhs@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
      - name: Record resource-guard-rails demo
        run: vhs templates/demos/tapes/resource-guard-rails.tape
