name: publish-media

on:
  push:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  pull_request:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 'stable'
      - name: Install VHS toolchain
        run: |
          go install github.com/charmbracelet/vhs@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
      - name: Record resource-guard-rails demo
        run: vhs templates/demos/tapes/resource-guard-rails.tape
