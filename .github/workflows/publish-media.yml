name: publish-media

on:
  push:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  pull_request:
    paths:
      - 'templates/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  workflow_dispatch:

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install VHS toolchain
        run: |
          go install github.com/charmbracelet/vhs@latest
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttyd
      - name: Record resource-guard-rails demo
        run: vhs templates/demos/tapes/resource-guard-rails.tape
