name: publish-media

on:
  push:
    paths:
      - '.cx/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  pull_request:
    paths:
      - '.cx/demos/tapes/**'
      - 'lib/demo.mjs'
      - 'lib/publish.mjs'
  workflow_dispatch:

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: charmbracelet/vhs-action@v1
        with:
          path: .cx/demos/tapes/resource-guard-rails.tape
          install-fonts: 'true'
