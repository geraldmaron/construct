name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

# One publish per tag; a second push of the same tag waits rather than racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can check the tag against main.
          fetch-depth: 0
          persist-credentials: false
      - name: verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; tag a commit that main's checks have passed" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18'
          # Every job here runs `npm ci` against the same lockfile. Without this
          # each one resolved and downloaded the tree from cold, five times a run.
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run conformance
      - name: download the explicitly supplied delivery bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir delivery
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern construct-delivery.zip --dir delivery
          python3 - <<'PYCODE'
          import pathlib, stat, zipfile
          with zipfile.ZipFile('delivery/construct-delivery.zip') as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit('delivery bundle contains an unsafe path')
              archive.extractall('delivery/bundle')
          PYCODE
      - name: select the already packed candidate
        id: candidate
        run: |
          mapfile -t candidates < <(find delivery/bundle -maxdepth 1 -type f -name '*.tgz')
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo 'delivery bundle must contain exactly one candidate tarball' >&2
            exit 1
          fi
          echo "path=${candidates[0]}" >> "$GITHUB_OUTPUT"
      - run: npm run smoke -- --tarball "${{ steps.candidate.outputs.path }}"
      - name: require both host receipts for these exact bytes
        run: npm run release:check -- --manifest=delivery/bundle/manifest.json --tarball="${{ steps.candidate.outputs.path }}"
      - name: verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag v$tag_version does not match package.json version $pkg_version" >&2
            exit 1
          fi
      # Trusted publishing (OIDC) needs npm >= 11.5.1, and no bundled npm clears
      # that bar: Node 22.18 and 22.20 both ship npm 10.9.3, and even Node 24.0.0
      # ships only 11.3.0 (per nodejs.org/dist/index.json). Pinned rather than
      # `@latest` because everything else in this repo that can drift is pinned;
      # bump it deliberately.
      #
      # Deliberately the LAST step before publish: `npm ci` and the whole gate
      # above run on the npm the pinned Node ships, so what was tested is what
      # ships, and only the publish client is newer.
      - run: npm install -g npm@11.5.1
      # No NODE_AUTH_TOKEN below. Auth is the OIDC token the runner mints from
      # `id-token: write`, checked against the trusted publisher registered on
      # the package (geraldmaron/construct, workflow release.yml). A long-lived
      # NPM_TOKEN's write scope cannot be verified without publishing; a trusted
      # publisher has no scope to get wrong. If this step fails auth, the
      # trusted publisher is not registered: that is registry-side
      # configuration and cannot be done from here.
      #
      # --tag alpha keeps every alpha off the default `latest` dist-tag, which
      # `npm publish` would otherwise move to whatever it publishes. `latest`
      # moves only when 3.0.0 is promoted deliberately.
      - run: npm publish "${{ steps.candidate.outputs.path }}" --provenance --tag alpha
