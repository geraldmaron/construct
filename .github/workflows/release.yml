name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  gate:
    name: release:check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Full test suite
        run: npm test
      - name: System health check
        run: node bin/construct doctor
      - name: Check managed doc regions
        run: node ./bin/construct docs:verify
      - name: Check dashboard static bundle
        run: node ./bin/construct dashboard:sync --check
      - name: Enforce comment policy
        run: node ./bin/construct lint:comments
      - name: Validate profiles + flavor overlays
        run: npm run lint:profiles -- --quiet
      - name: Functional tests
        run: npm run test:functional
      - name: npm audit (high+ only, production deps of published package)
        # Scoped to match ci.yml's audit: the published npm package's
        # production graph. `--omit=dev` drops devDependencies; `--workspaces=false`
        # excludes apps/* and packages/* which are not in the published `files`
        # list of the root package.json. Workspace-scoped vulns (docs site,
        # dashboard) have their own remediation track and don't gate the CLI release.
        run: npm audit --omit=dev --audit-level=high --workspaces=false
      - name: consumer-perspective audit (packed artifact, no overrides)
        # Audits the tree a downstream `npm install` resolves, where this
        # package.json's `overrides` do not apply. Blocks publishing a release
        # whose transitive graph is only clean because of a repo-local override.
        run: npm run audit:published

  # ── Build single-file binaries ────────────────────────────────────────────
  build-binary:
    name: binary (${{ matrix.os }}-${{ matrix.arch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            node_arch: x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            node_arch: arm64
          - os: darwin
            arch: x64
            runner: macos-15
            node_arch: x64
          - os: darwin
            arch: arm64
            runner: macos-15
            node_arch: arm64
          - os: windows
            arch: x64
            runner: windows-latest
            node_arch: x64

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - run: npm ci --omit=dev

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Bundle
        shell: bash
        run: |
          mkdir -p dist
          esbuild bin/construct \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --outfile=dist/construct-bundle.mjs \
            --external:@huggingface/transformers \
            --external:@xenova/transformers \
            --external:onnxruntime-node \
            --external:sharp \
            --external:postgres

      - name: Build SEA blob
        shell: bash
        run: |
          cat > dist/sea-config.json <<'EOF'
          {
            "main": "dist/construct-bundle.mjs",
            "output": "dist/sea-prep.blob",
            "disableExperimentalSEAWarning": true
          }
          EOF
          node --experimental-sea-config dist/sea-config.json

      - name: Produce binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN_NAME="construct-${{ matrix.os }}-${{ matrix.arch }}"
          cp "$(which node)" "dist/${BIN_NAME}"
          npx postject "dist/${BIN_NAME}" NODE_SEA_BLOB dist/sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x "dist/${BIN_NAME}"
          sha256sum "dist/${BIN_NAME}" > "dist/${BIN_NAME}.sha256"

      - name: Produce binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN_NAME = "construct-windows-x64.exe"
          Copy-Item (Get-Command node).Source "dist\$BIN_NAME"
          npx postject "dist\$BIN_NAME" NODE_SEA_BLOB dist\sea-prep.blob `
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          $hash = (Get-FileHash "dist\$BIN_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $BIN_NAME" | Out-File "dist\$BIN_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/construct-*
          if-no-files-found: error

  # ── Docker image ──────────────────────────────────────────────────────────
  docker:
    name: docker image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version + prerelease flag
        id: ver
        # A semver pre-release tag carries a "-" after the patch number, e.g.
        # 1.0.5-alpha.1. The pre-release channel (alpha, beta, rc, next) is the
        # identifier between the "-" and the first "." after it. Stable tags
        # (no "-") publish to the latest channel and bump the :latest image.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=$(echo "$VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-z]+).*/\1/')
            if [[ -z "$CHANNEL" || "$CHANNEL" == "$VERSION" ]]; then CHANNEL=next; fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (stable, both version + latest tags)
        if: steps.ver.outputs.prerelease == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/construct:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/construct:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (prerelease, version + channel tag only)
        if: steps.ver.outputs.prerelease == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/construct:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/construct:${{ steps.ver.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CVEs
        # Pin to a release tag — never use @master (supply-chain risk). Update when new releases ship.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/construct:${{ steps.ver.outputs.version }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  # ── GitHub Release + npm publish ──────────────────────────────────────────
  publish:
    name: publish
    needs: [build-binary, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # for npm provenance
    steps:
      - uses: actions/checkout@v6

      # Node 24 ships with npm 11+. npm CLI 11.5.1+ is required for Trusted
      # Publishers OIDC (https://docs.npmjs.com/trusted-publishers). Node 22
      # ships with npm 10.x which does not support OIDC-first auth and fell back
      # to the github.token injected by setup-node, causing a 404. With npm 11+,
      # OIDC is tried before any token fallback — registry-url is safe to use.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify OIDC token available
        # npm whoami requires classic auth and will always fail for OIDC Trusted
        # Publishers. Instead verify the OIDC endpoint is reachable — this is
        # what npm publish uses internally to exchange for a short-lived token.
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL not set — id-token: write permission missing"
            exit 1
          fi
          echo "OIDC endpoint available: $ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "Trusted Publishers exchange will happen inside npm publish."

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: binary-*
          merge-multiple: true

      - name: Detect pre-release channel
        id: ver
        # Same detection as the docker job; computed here so the publish job is
        # self-contained. A tag like v1.0.5-alpha.1 publishes to the alpha dist
        # channel (not latest). Stable tags go to latest by default.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL=$(echo "$VERSION" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-([a-z]+).*/\1/')
            if [[ -z "$CHANNEL" || "$CHANNEL" == "$VERSION" ]]; then CHANNEL=next; fi
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # Trusted Publishers OIDC. No stored secret. The --tag flag controls
        # which dist-tag the version is published under; stable goes to latest,
        # pre-releases go to alpha/beta/rc/next so `npm install` keeps
        # installing the stable line.
        run: npm publish --provenance --access public --tag ${{ steps.ver.outputs.channel }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_FLAG: ${{ steps.ver.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/construct-linux-x64 \
            dist/construct-linux-x64.sha256 \
            dist/construct-linux-arm64 \
            dist/construct-linux-arm64.sha256 \
            dist/construct-darwin-x64 \
            dist/construct-darwin-x64.sha256 \
            dist/construct-darwin-arm64 \
            dist/construct-darwin-arm64.sha256 \
            dist/construct-windows-x64.exe \
            dist/construct-windows-x64.exe.sha256 || true

  # ── Homebrew tap formula bump ─────────────────────────────────────────────
  # Gated on a repository variable so the step is skipped until the tap repo
  # and its access token exist. Set the variable via repo Settings → Variables
  # once you have created github.com/geraldmaron/homebrew-construct and added
  # the HOMEBREW_TAP_TOKEN secret. See docs/maintenance/homebrew-tap.md.
  homebrew:
    name: bump homebrew formula
    needs: publish
    # Homebrew tracks the stable line. Pre-release tags (e.g. v1.0.5-alpha.1)
    # are skipped here; alpha/beta/rc consumers install via npm with the
    # matching dist-tag instead.
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Update multi-arch formula in geraldmaron/homebrew-construct
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Download sha256 files from the release
          for asset in construct-darwin-arm64 construct-darwin-x64 construct-linux-arm64 construct-linux-x64; do
            gh release download "$TAG" --repo geraldmaron/construct --pattern "${asset}.sha256" --dir /tmp/shas
          done

          # Extract sha256 values
          SHA_DARWIN_ARM64=$(awk '{print $1}' /tmp/shas/construct-darwin-arm64.sha256)
          SHA_DARWIN_X64=$(awk '{print $1}' /tmp/shas/construct-darwin-x64.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' /tmp/shas/construct-linux-arm64.sha256)
          SHA_LINUX_X64=$(awk '{print $1}' /tmp/shas/construct-linux-x64.sha256)

          BASE_URL="https://github.com/geraldmaron/construct/releases/download/${TAG}"

          # Generate the formula
          cat > /tmp/construct.rb << FORMULA
          class Construct < Formula
            desc "Local-first agent orchestration layer for AI coding tools"
            homepage "https://github.com/geraldmaron/construct"
            version "${VERSION}"
            license "Elastic-2.0"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              on_arm do
                url "${BASE_URL}/construct-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/construct-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/construct-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/construct-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install Dir["construct-*"].first => "construct"
            end

            def caveats
              <<~EOS
                To finish setup on this machine, run:
                  construct setup

                Construct uses a local Postgres container (via Docker) for hybrid
                retrieval. If Docker is not installed, Construct falls back to a JSON
                vector index — no hard requirement.

                To wire up hooks and agents per project, add Construct as a dev
                dependency in that project:
                  npm install -D @geraldmaron/construct
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/construct version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' /tmp/construct.rb

          # Clone tap, update formula, push
          gh repo clone geraldmaron/homebrew-construct /tmp/tap -- --depth 1
          cp /tmp/construct.rb /tmp/tap/Formula/construct.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/geraldmaron/homebrew-construct.git"
          git add Formula/construct.rb
          git commit -m "construct ${VERSION}"
          git push
