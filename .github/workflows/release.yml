name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

# One publish per tag; a second push of the same tag waits rather than racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can check the tag against main.
          fetch-depth: 0
          persist-credentials: false
      - name: verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; tag a commit that main's checks have passed" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18'
          # Every job here runs `npm ci` against the same lockfile. Without this
          # each one resolved and downloaded the tree from cold, five times a run.
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - name: verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag v$tag_version does not match package.json version $pkg_version" >&2
            exit 1
          fi
      # Trusted publishing (OIDC) needs npm >= 11.5.1, and no bundled npm clears
      # that bar: Node 22.18 and 22.20 both ship npm 10.9.3, and even Node 24.0.0
      # ships only 11.3.0 (per nodejs.org/dist/index.json). Pinned rather than
      # `@latest` because everything else in this repo that can drift is pinned;
      # bump it deliberately.
      #
      # Deliberately the LAST step before publish: `npm ci` and the whole gate
      # above run on the npm the pinned Node ships, so what was tested is what
      # ships, and only the publish client is newer.
      - run: npm install -g npm@11.5.1
      # No NODE_AUTH_TOKEN below. Auth is the OIDC token the runner mints from
      # `id-token: write`, checked against the trusted publisher registered on
      # the package (geraldmaron/construct, workflow release.yml). A long-lived
      # NPM_TOKEN's write scope cannot be verified without publishing; a trusted
      # publisher has no scope to get wrong. If this step fails auth, the
      # trusted publisher is not registered: that is registry-side
      # configuration and cannot be done from here.
      #
      # --tag alpha keeps this off the default `latest` dist-tag, and that is
      # load-bearing rather than tidy: this package is the
      # predecessor's, whose `latest` is 2.1.1 and has real installs. `npm
      # publish` moves `latest` to whatever it publishes unless told otherwise,
      # so without this flag an alpha of a from-scratch rewrite would become the
      # default install for everyone already on 2.x. It is also how STRATEGY's
      # "no stability promise until the Phase 5 stakeholder-acceptance gate" is
      # enforced by the registry rather than implied by a version number.
      # `latest` moves only when 3.0.0 is promoted deliberately.
      - run: npm publish --provenance --tag alpha
