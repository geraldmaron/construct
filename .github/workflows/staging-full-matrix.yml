name: staging full matrix

# Closing construct-wrfcx: staging could diverge from main for 17 days with no
# full-matrix validation because ci.yml only runs the full OS x Node matrix on
# push-to-main / schedule / workflow_dispatch, while PRs and pushes to staging ran
# a single ubuntu runner + lint. Enforced mechanism (bead option b + c):
#
#   - A daily scheduled full matrix runs AGAINST `staging` so a red matrix there is
#     surfaced within ~1 day, not at release time.
#   - Promote staging → main.yml refuses to open the promotion PR unless the most
#     recent staging-full-matrix run concluded successfully (hard gate).
#
# The matrix mirrors ci.yml's `test` legs (ubuntu/macos x Node 20/22 x shards) plus
# the lint suite, run on a fixed cron so failures notify repo watchers by default.

on:
  schedule:
    # Daily at 09:17 UTC — off the :00 boundary to avoid the cron stampede.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: staging-full-matrix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-test:
    name: staging test (${{ matrix.os }} / node ${{ matrix.node }} / shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        node: ["20", "22"]
        shard: [1, 2, 3]
        exclude:
          - os: macos-latest
            shard: 2
          - os: macos-latest
            shard: 3
    env:
      CONSTRUCT_EMBEDDING_MODEL: hashing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: staging
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: cache pinned tool binaries (typst, bd)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin
          key: toolbin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/setup-toolchain.sh') }}
      - name: install test toolchain (typst, bd, pandoc, poppler, libreoffice)
        run: bash scripts/ci/setup-toolchain.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: build derived test fixtures (living graph + seeded vector index)
        run: bash scripts/ci/build-test-fixtures.sh
      - run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.os == 'macos-latest' && '1' || '3' }}
      - run: npm run doctor
        if: matrix.shard == 1
      - run: npm run docs:verify
        if: matrix.shard == 1

  staging-lint:
    name: staging lint suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:comments
      - run: npm run lint:js
      - run: npm run lint:scopes -- --quiet
      - run: npm run lint:agents
      - run: npm run lint:contracts
      - run: npm run docs:update -- --check
      - name: gates audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gates:audit
      - run: node ./bin/construct certify gate

  staging-required:
    name: staging-required
    runs-on: ubuntu-latest
    if: always()
    needs: [staging-test, staging-lint]
    steps:
      - name: Verify staging required jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          failed=$(echo "$NEEDS_JSON" | jq -r 'to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | map(.key)
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "Failed or cancelled staging required jobs: $failed"
            exit 1
          fi
          echo "All staging required jobs passed."
