name: Sync main → staging

# Every push to main opens a sync PR against staging so the integration
# branch never falls behind a release. Use peter-evans/create-pull-request
# (not direct push) so branch protection on staging stays intact and the
# merge is auditable. Manual workflow_dispatch is supported for one-shot
# alignment after a hand-merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check if staging is already up to date with main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "staging already contains origin/main — nothing to do."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            MAIN_SHA=$(git rev-parse --short origin/main)
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into a sync branch
        if: steps.check.outputs.already_synced == 'false'
        id: merge
        run: |
          SYNC_BRANCH="chore/sync-main-to-staging-${{ steps.check.outputs.main_sha }}"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${SYNC_BRANCH}"
          # Allow unrelated histories in case of a release squash that re-rooted main.
          # Use --no-ff so the merge commit is explicit in the staging history.
          if git merge --no-ff --no-edit origin/main; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            # Conflicts: stop the merge, open the PR anyway so a human resolves.
            git merge --abort
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open sync PR against staging
        if: steps.check.outputs.already_synced == 'false' && steps.merge.outputs.merge_status == 'clean'
        uses: peter-evans/create-pull-request@v7
        with:
          base: staging
          branch: ${{ steps.merge.outputs.sync_branch }}
          title: 'chore: sync main (${{ steps.check.outputs.main_sha }}) → staging'
          body: |
            Automated sync from `main` to keep `staging` from drifting after a release squash-merge.

            ## What this does

            Merges `origin/main` (HEAD: `${{ steps.check.outputs.main_sha }}`) into `staging` as an explicit merge commit. The diff against current staging is the set of commits landed on main since the last sync — typically a single squash from a release PR.

            ## How to handle

            - **Tree-only sync (no real diff)**: squash-merge with default message. The squash collapses the merge commit and keeps staging's history clean.
            - **New work landed on main bypass-style**: review the diff, then merge with a merge commit (preserves attribution).

            ## If this PR shows conflicts

            The workflow failed to auto-merge. Resolve locally:
            ```
            git fetch origin
            git checkout staging
            git merge origin/main
            # resolve, commit, push to staging
            ```
            Then close this PR.

            ---
            Generated by `.github/workflows/sync-main-to-staging.yml`.
          delete-branch: true
          labels: |
            automated
            sync

      - name: Notify on conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merging main (${{ steps.check.outputs.main_sha }}) into staging hit conflicts."
          echo "::error::Resolve locally: git fetch origin && git checkout staging && git merge origin/main"
          exit 1
