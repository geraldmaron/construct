name: Sync main → staging

# Every push to main opens a sync PR against staging so the integration
# branch never falls behind a release. The sync branch is pushed by the
# workflow itself (using GITHUB_TOKEN) and the PR is opened via gh CLI so
# branch protection on staging stays intact and the merge is auditable.
# Manual workflow_dispatch is supported for one-shot alignment after a
# hand-merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check if staging is already up to date with main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "staging already contains origin/main — nothing to do."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            MAIN_SHA=$(git rev-parse --short origin/main)
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into a sync branch and push
        if: steps.check.outputs.already_synced == 'false'
        id: merge
        run: |
          set -euo pipefail
          SYNC_BRANCH="chore/sync-main-to-staging-${{ steps.check.outputs.main_sha }}"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"

          # If a prior failed run left a remote branch, reuse it so we don't
          # collide. Force-update happens below via push --force-with-lease.
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
            echo "sync branch already exists on origin — will overwrite with --force-with-lease"
            git fetch origin "${SYNC_BRANCH}":"refs/remotes/origin/${SYNC_BRANCH}"
            EXISTING_REMOTE_REF="origin/${SYNC_BRANCH}"
          else
            EXISTING_REMOTE_REF=""
          fi

          git checkout -b "${SYNC_BRANCH}"

          # --no-ff so the merge commit is explicit; --allow-unrelated-histories
          # in case a release squash re-rooted main relative to staging.
          if git merge --no-ff --no-edit --allow-unrelated-histories origin/main; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -n "${EXISTING_REMOTE_REF}" ]; then
            git push --force-with-lease=refs/heads/"${SYNC_BRANCH}":"${EXISTING_REMOTE_REF}" origin "${SYNC_BRANCH}"
          else
            git push -u origin "${SYNC_BRANCH}"
          fi

      - name: Open sync PR against staging
        if: steps.check.outputs.already_synced == 'false' && steps.merge.outputs.merge_status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
          MAIN_SHA: ${{ steps.check.outputs.main_sha }}
        run: |
          set -euo pipefail
          # If a PR for this branch already exists (re-run of the same workflow
          # against the same main SHA), don't open a duplicate — exit cleanly.
          EXISTING_PR=$(gh pr list --head "${SYNC_BRANCH}" --base staging --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING_PR}" ]; then
            echo "PR #${EXISTING_PR} already open for ${SYNC_BRANCH}; nothing to do."
            exit 0
          fi
          gh pr create \
            --base staging \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync main (${MAIN_SHA}) → staging" \
            --body "Automated sync from \`main\` to keep \`staging\` from drifting after a release squash-merge.

          ## What this does

          Merges \`origin/main\` (HEAD: \`${MAIN_SHA}\`) into \`staging\` as an explicit merge commit. The diff against current staging is the set of commits landed on main since the last sync - typically a single squash from a release PR.

          ## How to handle

          - **Tree-only sync (no real diff)**: squash-merge with default message. The squash collapses the merge commit and keeps staging's history clean.
          - **New work landed on main bypass-style**: review the diff, then merge with a merge commit (preserves attribution).

          ## If this PR shows conflicts

          The workflow failed to auto-merge. Resolve locally:
          \`\`\`
          git fetch origin
          git checkout staging
          git merge origin/main
          # resolve, commit, push to staging
          \`\`\`
          Then close this PR.

          ---
          Generated by \`.github/workflows/sync-main-to-staging.yml\`."

      - name: Notify on conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merging main (${{ steps.check.outputs.main_sha }}) into staging hit conflicts."
          echo "::error::Resolve locally: git fetch origin && git checkout staging && git merge origin/main"
          exit 1
