name: Sync main → staging

# Every push to main opens a sync PR against staging so the integration
# branch never falls behind a release.
#
# Token strategy. The workflow prefers a project-scoped PAT
# (`secrets.SYNC_PR_TOKEN`) when set; otherwise it falls back to the default
# `GITHUB_TOKEN`. The PAT path is preferred because workflows triggered by
# `GITHUB_TOKEN` pushes do not fire downstream workflows (GitHub's anti-loop
# guard), so the auto-opened sync PR sits without CI checks and cannot
# satisfy branch protection on staging. A PAT push triggers CI normally.
#
# Required repo policy. Settings → Actions → General → Workflow permissions
# → "Allow GitHub Actions to create and approve pull requests" must be
# enabled. Without it, `gh pr create` fails with
# "GitHub Actions is not permitted to create or approve pull requests".
# This is documented in docs/maintenance/release-and-deploy.md.
#
# Manual workflow_dispatch is supported for one-shot alignment after a
# hand-merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Report token mode
        run: |
          if [ -n "${{ secrets.SYNC_PR_TOKEN }}" ]; then
            echo "Using SYNC_PR_TOKEN (PAT). Downstream CI will fire on the sync PR."
          else
            echo "::warning::Using default GITHUB_TOKEN. Workflows triggered by GITHUB_TOKEN pushes do not fire downstream Actions, so the auto-opened sync PR will not run CI and will require an admin-merge to land. Set the SYNC_PR_TOKEN repo secret (fine-grained PAT with contents:write + pull-requests:write) to fix this."
          fi

      - name: Check if staging is already up to date with main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "staging already contains origin/main — nothing to do."
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            MAIN_SHA=$(git rev-parse --short origin/main)
            echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into a sync branch and push
        if: steps.check.outputs.already_synced == 'false'
        id: merge
        run: |
          set -euo pipefail
          SYNC_BRANCH="chore/sync-main-to-staging-${{ steps.check.outputs.main_sha }}"
          echo "sync_branch=${SYNC_BRANCH}" >> "$GITHUB_OUTPUT"

          # If a prior failed run left a remote branch, reuse it so we don't
          # collide. Force-update happens below via push --force-with-lease.
          if git ls-remote --exit-code --heads origin "${SYNC_BRANCH}" >/dev/null 2>&1; then
            echo "sync branch already exists on origin — will overwrite with --force-with-lease"
            git fetch origin "${SYNC_BRANCH}":"refs/remotes/origin/${SYNC_BRANCH}"
            EXISTING_REMOTE_REF="origin/${SYNC_BRANCH}"
          else
            EXISTING_REMOTE_REF=""
          fi

          git checkout -b "${SYNC_BRANCH}"

          # --no-ff so the merge commit is explicit; --allow-unrelated-histories
          # in case a release squash re-rooted main relative to staging.
          if git merge --no-ff --no-edit --allow-unrelated-histories origin/main; then
            echo "merge_status=clean" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -n "${EXISTING_REMOTE_REF}" ]; then
            git push --force-with-lease=refs/heads/"${SYNC_BRANCH}":"${EXISTING_REMOTE_REF}" origin "${SYNC_BRANCH}"
          else
            git push -u origin "${SYNC_BRANCH}"
          fi

      - name: Open sync PR against staging
        if: steps.check.outputs.already_synced == 'false' && steps.merge.outputs.merge_status == 'clean'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
          MAIN_SHA: ${{ steps.check.outputs.main_sha }}
        run: |
          set -uo pipefail
          # If a PR for this branch already exists (re-run of the same workflow
          # against the same main SHA), don't open a duplicate — exit cleanly.
          EXISTING_PR=$(gh pr list --head "${SYNC_BRANCH}" --base staging --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING_PR}" ]; then
            echo "PR #${EXISTING_PR} already open for ${SYNC_BRANCH}; nothing to do."
            exit 0
          fi
          PR_BODY="Automated sync from \`main\` to keep \`staging\` from drifting after a release squash-merge.

          ## What this does

          Merges \`origin/main\` (HEAD: \`${MAIN_SHA}\`) into \`staging\` as an explicit merge commit. The diff against current staging is the set of commits landed on main since the last sync - typically a single squash from a release PR.

          ## How to handle

          - **Tree-only sync (no real diff)**: squash-merge with default message. The squash collapses the merge commit and keeps staging's history clean.
          - **New work landed on main bypass-style**: review the diff, then merge with a merge commit (preserves attribution).

          ## If this PR shows conflicts

          The workflow failed to auto-merge. Resolve locally:
          \`\`\`
          git fetch origin
          git checkout staging
          git merge origin/main
          # resolve, commit, push to staging
          \`\`\`
          Then close this PR.

          ---
          Generated by \`.github/workflows/sync-main-to-staging.yml\`."

          CREATE_OUTPUT=$(gh pr create \
            --base staging \
            --head "${SYNC_BRANCH}" \
            --title "chore: sync main (${MAIN_SHA}) → staging" \
            --body "${PR_BODY}" 2>&1)
          CREATE_EXIT=$?
          echo "${CREATE_OUTPUT}"

          if [ ${CREATE_EXIT} -ne 0 ]; then
            if echo "${CREATE_OUTPUT}" | grep -q "not permitted to create or approve pull requests"; then
              echo "::error::Repo policy 'Allow GitHub Actions to create and approve pull requests' is disabled. Enable at https://github.com/${GITHUB_REPOSITORY}/settings/actions then re-run this workflow. (See docs/maintenance/release-and-deploy.md.)"
            elif echo "${CREATE_OUTPUT}" | grep -q "could not add label"; then
              echo "::error::PR created but label add failed. Check the workflow's --label flags against existing repo labels."
            else
              echo "::error::Sync PR creation failed. Re-trigger via workflow_dispatch after diagnosing."
            fi
            exit ${CREATE_EXIT}
          fi

      - name: Notify on conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merging main (${{ steps.check.outputs.main_sha }}) into staging hit conflicts."
          echo "::error::Resolve locally: git fetch origin && git checkout staging && git merge origin/main"
          exit 1
