# docker-compose.team.yml — Construct team-mode topology.
#
# Brings up the control plane (Construct CLI + dashboard), a worker pool
# claiming from the Postgres-backed intake queue, the data plane (Postgres
# + pgvector), and the telemetry plane (Langfuse). The MCP broker is a
# library that lives inside the control plane (lib/mcp/broker.mjs) — not
# a separate service yet, so it's not its own container here.
#
# Usage:
#   export CONSTRUCT_PROJECT_NAME=myproject
#   docker compose -f docker-compose.team.yml up -d
#
# The workspace bind-mount is the project directory you want workers to
# act against. By default the compose mounts the current directory; set
# CONSTRUCT_WORKSPACE to override.
#
# Solo mode does NOT use this file — it uses ~/.construct/services/postgres
# and langfuse/docker-compose.yml managed by `construct up`. This file is
# specifically for shared / team deployments.

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: construct-team-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: construct
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-construct}
      POSTGRES_DB: construct
    volumes:
      - construct-team-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construct -d construct"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: construct-worker:local
    restart: unless-stopped
    deploy:
      replicas: ${CONSTRUCT_WORKER_REPLICAS:-2}
    environment:
      DATABASE_URL: postgres://construct:${POSTGRES_PASSWORD:-construct}@postgres:5432/construct
      CONSTRUCT_PROJECT_NAME: ${CONSTRUCT_PROJECT_NAME:-construct}
      CONSTRUCT_TENANT_ID: ${CONSTRUCT_TENANT_ID:-}
      CONSTRUCT_DEPLOYMENT_MODE: team
      CONSTRUCT_INTAKE_QUEUE_BACKEND: postgres
      CONSTRUCT_TRACE_BACKEND: langfuse
      LANGFUSE_BASEURL: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-construct-local}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-construct-local}
    volumes:
      - ${CONSTRUCT_WORKSPACE:-./}:/work:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Langfuse stays in its own compose file (langfuse/docker-compose.yml) so
  # the team topology can choose to point at it via `LANGFUSE_BASEURL`
  # rather than re-declare ten services here. Run them side by side:
  #   docker compose -f langfuse/docker-compose.yml up -d
  #   docker compose -f docker-compose.team.yml up -d

volumes:
  construct-team-postgres-data:
