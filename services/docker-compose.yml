# Construct — core services (Postgres + pgvector)
#
# Provides the persistent data plane for Construct:
#   - Postgres with pgvector for vector memory and RAG
#
# Usage:
#   docker compose -f services/docker-compose.yml -p construct-services up -d

name: construct-services

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: construct-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM:-512m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-construct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-construct}
      POSTGRES_DB: ${POSTGRES_DB:-construct}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - construct_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-construct} -d ${POSTGRES_DB:-construct}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  construct_postgres_data:
    driver: local
