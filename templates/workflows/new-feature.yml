version: 1
id: new-feature
title: New feature workflow
description: PRD to ADR to tests to implementation to review chain.

inputs:
  - name: feature_name
    prompt: "Short feature name (lowercase-hyphenated)"
    required: true
  - name: owner
    prompt: "Owner specialist"
    default: engineer

artifacts:
  - template: prd.md
    path: "docs/specs/prd/${feature_name}.md"
    title: "PRD: ${feature_name}"

  - template: adr.md
    path: "docs/decisions/adr/${feature_name}.md"
    title: "ADR: ${feature_name}"
    depends_on:
      - "docs/specs/prd/${feature_name}.md"

  - template: test-plan.md
    path: "docs/test-plans/${feature_name}.md"
    depends_on:
      - "docs/decisions/adr/${feature_name}.md"

beads_items:
  - type: feature
    title: "${feature_name}: spec"
    link_to: "docs/specs/prd/${feature_name}.md"

  - type: feature
    title: "${feature_name}: design"
    link_to: "docs/decisions/adr/${feature_name}.md"
    depends_on_prior: true

  - type: feature
    title: "${feature_name}: implementation"
    depends_on_prior: true

  - type: feature
    title: "${feature_name}: review"
    depends_on_prior: true

checks:
  - name: prd-precedes-adr
    kind: file-order
    files:
      - "docs/specs/prd/${feature_name}.md"
      - "docs/decisions/adr/${feature_name}.md"
