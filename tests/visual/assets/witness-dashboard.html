<!--
  tests/visual/assets/witness-dashboard.html — static shell for visual witness output.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Construct visual witness</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Construct visual witness</h1>
      <a id="dashboard-link" class="header-link" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="header-right">
      <label class="toggle"><input type="checkbox" id="autoscroll" checked /> Auto-scroll</label>
      <button type="button" id="copy-url" class="btn">Copy link</button>
      <div id="status" class="status running">Connecting…</div>
    </div>
  </header>
  <main>
    <aside class="sidebar-left">
      <p class="panel-title">Stages</p>
      <nav id="stages" class="stage-nav"></nav>
      <p class="panel-title">Actions</p>
      <ul id="actions"></ul>
    </aside>
    <section class="terminal-pane">
      <div class="terminal-toolbar">
        <span class="panel-title">Terminal transcript</span>
        <span id="stage-label" class="stage-label">—</span>
      </div>
      <div id="terminal" class="terminal" aria-live="polite"></div>
    </section>
    <aside class="sidebar-right">
      <p class="panel-title">Depth &amp; results</p>
      <ul id="depth"></ul>
      <p class="panel-title">Evidence</p>
      <div id="evidence" class="evidence muted">—</div>
      <p class="panel-title">Summary</p>
      <pre id="summary" class="summary"></pre>
    </aside>
  </main>
  <script src="/client.js" type="module"></script>
</body>
</html>
